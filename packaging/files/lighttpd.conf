# Шлюз FlowGate: статика фронта и /api в общем экземпляре lighttpd из Entware (S80lighttpd).
# Ставится как /opt/etc/lighttpd/conf.d/90-flowgate.conf. Основной порт сервера (server.port) не трогаем: его задают
# другие пакеты или 05-default-port.conf из postinst. Всё наше — только на сокете :8090.
# Модули mod_proxy, mod_deflate, mod_rewrite, mod_setenv подключают 30-*.conf из пакетов lighttpd-mod-*.
# Бэкенд слушает только 127.0.0.1:8091, наружу (LAN и KeenDNS) смотрит этот сокет.

$SERVER["socket"] == ":8090" {
    server.document-root = "/opt/share/flowgate/www"
    index-file.names = ( "index.html" )

    # SPA: всё, что не файл и не /api, отдаёт 200.html (fallback adapter-static).
    url.rewrite-if-not-file = ( "^/(?!api/)" => "/200.html" )

    deflate.mimetypes = ( "text/html", "text/css", "text/javascript", "application/json", "image/svg+xml" )
    deflate.allowed-encodings = ( "gzip", "deflate" )

    # Хешированные чанки кешируются навсегда, остальная статика проверяется, у /api заголовок ставит бэкенд.
    $HTTP["url"] =~ "^/_app/immutable/" {
        setenv.add-response-header = (
            "Cache-Control" => "public, max-age=31536000, immutable",
            "X-Frame-Options" => "DENY",
            "X-Content-Type-Options" => "nosniff",
            "Referrer-Policy" => "same-origin",
        )
    }
    $HTTP["url"] !~ "^/(_app/immutable|api)/" {
        setenv.add-response-header = (
            "Cache-Control" => "no-cache",
            "X-Frame-Options" => "DENY",
            "X-Content-Type-Options" => "nosniff",
            "Referrer-Policy" => "same-origin",
        )
    }

    # Ответы бэкенда отдаются потоком: иначе поток изменений /api/events (SSE) копился бы в буфере.
    $HTTP["url"] =~ "^/api/" {
        proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8091 ) ) )
        proxy.forwarded = ( "for" => 1, "proto" => 1 )
        server.stream-response-body = 2
        setenv.add-response-header = (
            "X-Frame-Options" => "DENY",
            "X-Content-Type-Options" => "nosniff",
            "Referrer-Policy" => "same-origin",
        )
    }
}
