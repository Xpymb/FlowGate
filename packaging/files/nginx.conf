# Шлюз FlowGate: статика фронта и /api. Отдельный экземпляр nginx из Entware (nginx-ssl), запускает S99flowgate:
#   nginx -p /tmp/flowgate/nginx/ -c /opt/share/flowgate/nginx.conf
# Относительные пути — от префикса -p (tmpfs). Штатный /opt/etc/nginx и S80nginx не используются.
# Бэкенд слушает только 127.0.0.1:8091, наружу (LAN и KeenDNS) смотрит этот сервер.

# Группы nogroup на Keenetic нет — без явной группы воркер не стартует.
user nobody nobody;
worker_processes 1;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 128;
}

http {
    types {
        text/html                html;
        text/css                 css;
        text/plain               txt;
        application/javascript   js mjs;
        application/json         json;
        image/svg+xml            svg;
        image/png                png;
        image/x-icon             ico;
        font/woff2               woff2;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types application/javascript application/json text/css;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    access_log off;

    client_body_temp_path temp/body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    # Статика сжата при сборке (.gz рядом с файлом); ответы API крупнее 1 КиБ сжимаются на лету.
    gzip_static on;
    gzip on;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_types application/json;

    # Хешированные чанки кешируются навсегда, остальная статика проверяется, у /api заголовок ставит бэкенд.
    map $uri $flowgate_cache_control {
        ~^/_app/immutable/  "public, max-age=31536000, immutable";
        ~^/api/             "";
        default             "no-cache";
    }

    limit_req_zone $binary_remote_addr zone=flowgate_login:1m rate=10r/m;

    upstream flowgate_backend {
        server 127.0.0.1:8091;
        keepalive 4;
    }

    server {
        listen 8090;
        root /opt/share/flowgate/www;

        add_header Cache-Control $flowgate_cache_control always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            try_files $uri /200.html;
        }

        location /api/ {
            # Этап 7: включить после появления /api/auth/check в бэкенде.
            # auth_request /_auth;
            proxy_pass http://flowgate_backend;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 32m;
        }

        # Поток изменений (Server-Sent Events): без буферизации, ping от бэкенда раз в 25 с держит соединение.
        location = /api/events {
            # auth_request /_auth;
            proxy_pass http://flowgate_backend;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            gzip off;
        }

        location = /api/health {
            proxy_pass http://flowgate_backend;
        }

        location /api/auth/ {
            proxy_pass http://flowgate_backend;
        }

        location = /api/auth/login {
            limit_req zone=flowgate_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://flowgate_backend;
        }

        location = /_auth {
            internal;
            proxy_pass http://flowgate_backend/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
    }
}
